# ============================================================
# BakeryCloud - Fly.io (región Madrid)
#
# Requisitos previos:
#   1. fly auth signup (crear cuenta)
#   2. fly launch (crear la app y detectar el Dockerfile)
#   3. fly secrets set (ver paso 5 de la guía)
#   4. fly deploy
#
# PostgreSQL: Supabase free tier (EU) — ver flyio-guide.md
# ============================================================

app = "bakerycloud-kokoro"
primary_region = "mad"

[build]
  dockerfile = "docker/api.Dockerfile"

[env]
  NODE_ENV = "production"
  DEFAULT_TENANT_SLUG = "kokorocakes"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

[[http_service.checks]]
  [http_service.checks.health]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    path = "/api/health"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
