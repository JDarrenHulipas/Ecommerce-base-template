# fly.toml app configuration file generated for bakerycloud-kokoro
# Region: Madrid (mad) — mejor latencia desde España

app = 'bakerycloud-kokoro'
primary_region = 'mad'

[build]
  dockerfile = 'docker/api.Dockerfile'

[env]
  DEFAULT_TENANT_SLUG = 'kokorocakes'
  NODE_ENV = 'production'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 25
    soft_limit = 20

  [[http_service.checks]]
    grace_period = '10s'
    interval = '15s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256