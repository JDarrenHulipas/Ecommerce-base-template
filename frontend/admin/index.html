<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BakeryCloud Admin</title>
  <link rel="stylesheet" href="/src/styles/main.css">
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>

  <header class="admin-header">
    <h1>BakeryCloud Admin</h1>
    <div class="admin-tools" id="admin-tools" hidden>
      <label class="admin-tenant-label">Tienda
        <select id="admin-tenant" aria-label="Tienda activa"></select>
      </label>
      <button type="button" id="admin-refresh">Refrescar</button>
      <button type="button" id="admin-logout">Salir</button>
    </div>
  </header>

  <main class="admin-main">
    <section class="admin-login" id="admin-login">
      <h2>Acceso restringido</h2>
      <p class="admin-msg" id="admin-login-msg" role="status"></p>
      <form id="admin-login-form">
        <input type="password" id="admin-password" placeholder="Contraseña de administración"
               autocomplete="current-password" required aria-label="Contraseña de administración">
        <button type="submit" class="btn btn-primary">Entrar</button>
      </form>
    </section>

    <section class="admin-panel" id="admin-panel" hidden>
      <p class="admin-msg" id="admin-msg" role="status"></p>

      <nav class="admin-tabs" role="tablist">
        <button type="button" class="admin-tab active" data-tab="productos">Productos</button>
        <button type="button" class="admin-tab" data-tab="pedidos">Pedidos</button>
        <button type="button" class="admin-tab" data-tab="contactos">Contactos</button>
        <button type="button" class="admin-tab" data-tab="contenido">Contenido de la portada</button>
      </nav>

      <div class="admin-tabpanel" id="panel-productos">
        <details class="nuevo-producto" id="nuevo-producto">
          <summary>+ Añadir producto nuevo</summary>
          <form class="producto-form" id="producto-form">
            <div class="producto-form-grid">
              <label>Nombre *
                <input type="text" id="np-nombre" required aria-label="Nombre del producto">
              </label>
              <label>Slug (opcional, auto desde el nombre)
                <input type="text" id="np-slug" aria-label="Slug del producto">
              </label>
              <label>Categoría
                <input type="text" id="np-categoria" aria-label="Categoría del producto">
              </label>
              <label>Precio (€)
                <input type="number" id="np-precio" step="0.01" min="0" value="0" aria-label="Precio">
              </label>
              <label>Stock
                <input type="number" id="np-stock" step="1" min="0" value="0" aria-label="Stock">
              </label>
              <label class="producto-check">
                <input type="checkbox" id="np-disponible" checked aria-label="Disponible">
                Disponible
              </label>
              <label class="producto-full">Imagen
                <span class="img-cell">
                  <span class="img-preview" id="np-img-preview"><span class="img-none">Sin imagen</span></span>
                  <input type="file" id="np-file" accept="image/*" hidden>
                  <button type="button" id="np-img-btn" class="img-btn">Subir imagen</button>
                  <button type="button" id="np-img-clear" class="img-clear" hidden>Quitar</button>
                </span>
              </label>
              <label class="producto-full">Descripción
                <input type="text" id="np-desc" aria-label="Descripción del producto">
              </label>
              <label class="producto-full">Ingredientes
                <textarea id="np-ing" rows="2" aria-label="Ingredientes del producto"></textarea>
              </label>
            </div>
            <button type="submit" class="save-btn">Crear producto</button>
          </form>
        </details>
        <div class="table-wrap">
          <table class="admin-table" id="admin-table">
            <thead>
              <tr>
                <th>Producto</th>
                <th>Ingredientes</th>
                <th>Categoría</th>
                <th>Imagen</th>
                <th>Precio (€)</th>
                <th>Stock</th>
                <th>Disponible</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="admin-tbody"></tbody>
          </table>
        </div>
      </div>

      <div class="admin-tabpanel" id="panel-pedidos" hidden>
        <p class="admin-msg" id="pedidos-msg" role="status"></p>
        <div class="table-wrap">
          <table class="admin-table" id="pedidos-table">
            <thead>
              <tr>
                <th>Fecha</th>
                <th>Cliente</th>
                <th>Productos</th>
                <th>Estado</th>
                <th>Total (€)</th>
              </tr>
            </thead>
            <tbody id="pedidos-tbody"></tbody>
          </table>
        </div>
      </div>

      <div class="admin-tabpanel" id="panel-contactos" hidden>
        <p class="admin-msg" id="contactos-msg" role="status"></p>
        <div class="table-wrap">
          <table class="admin-table" id="contactos-table">
            <thead>
              <tr>
                <th>Fecha</th>
                <th>Nombre</th>
                <th>Email</th>
                <th>Mensaje</th>
              </tr>
            </thead>
            <tbody id="contactos-tbody"></tbody>
          </table>
        </div>
      </div>

      <div class="admin-tabpanel" id="panel-contenido" hidden>
        <form class="contenido-form" id="contenido-form">
          <div class="contenido-campos" id="contenido-campos"></div>
          <button type="submit" class="save-btn">Guardar contenido</button>
        </form>
        <p class="admin-msg" id="contenido-msg" role="status"></p>
      </div>
    </section>
  </main>

  <script src="/admin/admin.js"></script>
</body>
</html>
