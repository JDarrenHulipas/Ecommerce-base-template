# ============================================================
# BakeryCloud - Configuración nginx (frontend + proxy de API)
# ============================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Respeta el backend HTTP1.1 (necesario para CORS / keep-alive)
    proxy_http_version 1.1;

    # Toda la API se proxifica al contenedor `api`
    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: todo lo que no es un archivo real cae en index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache corta para imágenes estáticas
    location ~* \.(jpg|jpeg|png|ico)$ {
        expires 1h;
        add_header Cache-Control "public";
    }
}
