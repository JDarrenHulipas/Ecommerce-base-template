# ============================================================
# BakeryCloud - CI (GitHub Actions)
#
#  - push a `master`  ->  tests (docker compose completo):
#    tests de integración (API + admin) y tests E2E (Playwright)
#
# El despliegue a producción es manual con Fly.io:
#   fly deploy   (app: bakerycloud-kokoro)
#
# Historial: antes había un job que subía el código a una EC2 con
# docker compose prod (RDS); se eliminó cuando la producción pasó
# a Fly.io y la EC2 se dio de baja.
# ============================================================

name: CI/CD

on:
  push:
    branches: [master]

concurrency:
  group: bakerycloud-deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://bakery_api:cambia_esta_password@localhost:5432/bakerycloud
      DEFAULT_TENANT_SLUG: kokorocakes
      ADMIN_USERNAME: cambia_esta_usuario
      ADMIN_PASSWORD: cambia_esta_admin
      ADMIN_SECRET: cambia_esta_clave
    steps:
      - uses: actions/checkout@v4

      - name: Levantar el stack completo (frontend + API + BD)
        run: docker compose -f docker/docker-compose.yml up -d --build

      - name: Esperar a que la API esté sana
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/api/health >/dev/null && break
            sleep 2
          done
          curl -sf http://localhost:3000/api/health >/dev/null

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias del backend
        working-directory: backend
        run: npm ci

      - name: Tests de integración (API + admin)
        working-directory: backend
        run: npm run test:api

      - name: Tests E2E (Playwright)
        working-directory: backend
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
